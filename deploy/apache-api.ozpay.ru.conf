# Mini-app + API на https://api.ozpay.ru/
#
#   sudo cp deploy/apache-api.ozpay.ru.conf /etc/apache2/sites-available/api.ozpay.ru.conf
#   sudo a2enmod ssl proxy proxy_http headers
#   sudo a2ensite api.ozpay.ru
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Если сайт уже есть — вставь блоки DocumentRoot, Directory и ProxyPass в текущий vhost.

<VirtualHost *:443>
    ServerName api.ozpay.ru

    DocumentRoot /var/www/api.ozpay.ru/ozpay/webapp
    DirectoryIndex index.html

    <Directory /var/www/api.ozpay.ru/ozpay/webapp>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # API панели (FastAPI на 5001). Apache сам держит SSL на 443.
    SSLProxyEngine On
    SSLProxyCheckPeerName Off
    SSLProxyCheckPeerCN Off
    SSLProxyCheckPeerExpire Off
    ProxyPreserveHost On
    ProxyPass /api https://127.0.0.1:5001/api
    ProxyPassReverse /api https://127.0.0.1:5001/api

    # уведомления, если notify_server слушает 3000:
    # ProxyPass /notify https://127.0.0.1:3000/notify
    # ProxyPass /ozpay/notify https://127.0.0.1:3000/ozpay/notify

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/api.ozpay.ru/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/api.ozpay.ru/privkey.pem
    # если fullchain.pem нет:
    # SSLCertificateFile /etc/letsencrypt/live/api.ozpay.ru/cert.pem
    # SSLCertificateChainFile /etc/letsencrypt/live/api.ozpay.ru/chain.pem

    ErrorLog ${APACHE_LOG_DIR}/api.ozpay.ru-error.log
    CustomLog ${APACHE_LOG_DIR}/api.ozpay.ru-access.log combined
</VirtualHost>
